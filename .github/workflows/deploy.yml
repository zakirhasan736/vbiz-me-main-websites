name: Deploy to Production

on:
  push:
    branches:
      - main

# Queue deploys instead of cancelling. Cancelling stops the GitHub job but not the
# script already running on the server over SSH, so two merges in quick succession
# ran two `npm ci` in the same folder at once and broke node_modules (ENOTEMPTY).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.DEPLOYMENT_SECRETS }}
          port: ${{ secrets.PORT }}
          script_stop: true
          script: |
            set -e

            echo "====== Deploy Started ======"

            cd /var/www/vbiz-me-main

            echo "Fetching latest code..."
            git fetch origin

            echo "Resetting to latest main..."
            git reset --hard origin/main

            echo "Installing dependencies..."
            # A half-removed node_modules from an interrupted install makes npm ci fail; clear it and retry once.
            npm ci || { echo "npm ci failed, clearing node_modules and retrying..."; rm -rf node_modules; npm ci; }

            echo "Building Next.js..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart vbizme --update-env

            echo "Saving PM2..."
            pm2 save

            echo "Deployment completed successfully!"